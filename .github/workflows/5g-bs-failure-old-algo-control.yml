name: 5G BS Failure Legacy Control

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout simulator
        uses: actions/checkout@v4
        with:
          repository: cpptromar/5G-Self-Organized-Network-Simulator
          ref: master
          path: sim

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev

      - name: Configure controlled headless failure experiment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for header in Path('sim/SHNSim').glob('*.h'):
              text = header.read_text(encoding='utf-8-sig')
              if 'uint32_t' in text and '#include <cstdint>' not in text and '#include <stdint.h>' not in text:
                  header.write_text('#include <cstdint>\n' + text, encoding='utf-8')

          p = Path('sim/SHNSim/GUIMain.cpp')
          s = p.read_text(encoding='utf-8-sig')
          main_start = s.index('int main(int argc, char** argv)')
          main_end = s.index('//Holds the logic for how the progress bar is updated', main_start)
          main = r'''int main(int argc, char** argv)
          {
              GUIDataContainer::argc = argc;
              GUIDataContainer::argv = argv;
              FileIO::setFPSlash('/');
              GUIDataContainer::count = 7;
              GUIDataContainer::bsLen = 10;
              GUIDataContainer::antNum = 3;
              GUIDataContainer::transNum = 100;
              GUIDataContainer::uePerAnt = 15;
              GUIDataContainer::simLen = 240;
              GUIDataContainer::simNum = 1;
              GUIDataContainer::simStartNum = 0;
              GUIDataContainer::simName = "bs_failure_oldalgo";
              GUIDataContainer::bufSizeInSeconds = 10;
              GUIDataContainer::congestionState = 90;
              GUIDataContainer::alertState = 80;
              GUIDataContainer::algorithmVer = 0;
              GUIDataContainer::RSRPThreshold = -85.0f;
              GUIDataContainer::mobilityBufSizeInMinutes = 5;
              GUIDataContainer::status = {3, 0, 0, 0, 0, 0, 0};
              GUIDataContainer::startTime = {100, 0, 0, 0, 0, 0, 0};
              GUIDataContainer::riseTime  = {1, 1, 1, 1, 1, 1, 1};
              GUIDataContainer::endState  = {0, 50, 50, 50, 50, 50, 50};

              GUIDataContainer::neighbors[0].push_back({1, 1});
              GUIDataContainer::neighbors[0].push_back({5, 3});
              GUIDataContainer::neighbors[0].push_back({6, 2});
              GUIDataContainer::neighbors[1].push_back({0, 4});
              GUIDataContainer::neighbors[1].push_back({2, 2});
              GUIDataContainer::neighbors[1].push_back({6, 3});
              GUIDataContainer::neighbors[2].push_back({1, 5});
              GUIDataContainer::neighbors[2].push_back({3, 3});
              GUIDataContainer::neighbors[2].push_back({6, 4});
              GUIDataContainer::neighbors[3].push_back({2, 6});
              GUIDataContainer::neighbors[3].push_back({4, 4});
              GUIDataContainer::neighbors[3].push_back({6, 5});
              GUIDataContainer::neighbors[4].push_back({3, 1});
              GUIDataContainer::neighbors[4].push_back({5, 5});
              GUIDataContainer::neighbors[4].push_back({6, 6});
              GUIDataContainer::neighbors[5].push_back({0, 6});
              GUIDataContainer::neighbors[5].push_back({4, 2});
              GUIDataContainer::neighbors[5].push_back({6, 1});
              GUIDataContainer::neighbors[6].push_back({0, 5});
              GUIDataContainer::neighbors[6].push_back({1, 6});
              GUIDataContainer::neighbors[6].push_back({2, 1});
              GUIDataContainer::neighbors[6].push_back({3, 2});
              GUIDataContainer::neighbors[6].push_back({4, 3});
              GUIDataContainer::neighbors[6].push_back({5, 4});
              return Setup::GUIentryPoint() ? 0 : 1;
          }

          '''
          s = s[:main_start] + main + s[main_end:]
          fn_start = s.index('void GUIMain::doProgressBar(double frac, bool fin)')
          brace = s.index('{', fn_start)
          depth = 0
          for i in range(brace, len(s)):
              depth += (s[i] == '{') - (s[i] == '}')
              if depth == 0:
                  fn_end = i + 1
                  break
          s = s[:fn_start] + 'void GUIMain::doProgressBar(double, bool) {}' + s[fn_end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build simulator
        working-directory: sim/SHNSim
        run: make output

      - name: Run scenario
        working-directory: sim/SHNSim
        run: ./output 2>&1 | tee run.log

      - name: Measure recovery
        working-directory: sim/SHNSim
        run: |
          python3 - <<'PY'
          import csv, json, math
          from collections import Counter, defaultdict
          path='bs_failure_oldalgo_SIM_0.csv'
          rows=[]
          with open(path,newline='') as f:
              for r in csv.DictReader(f):
                  rows.append({'t':int(r['Time']),'bs':int(r['BS_ID']),'status':int(r['BS_STATUS']),'ue':int(r['UE_ID']),'demand':float(r['DEMAND_DR (bits)']),'real':float(r['REAL_DR (bits)']),'rsrp':float(r['RSRP (dBm)']),'ddr':float(r['DDR (%)'])})
          affected={r['ue'] for r in rows if 80<=r['t']<=99 and r['bs']==0}
          def met(lo,hi):
              rr=[r for r in rows if lo<=r['t']<=hi and r['ue'] in affected]
              demand=sum(r['demand'] for r in rr); real=sum(r['real'] for r in rr)
              return {'window':[lo,hi],'unique_users':len({r['ue'] for r in rr}),'demand_satisfaction':real/demand if demand else None,'relocated_row_fraction':sum(r['bs']!=0 for r in rr)/len(rr) if rr else None,'mean_rsrp_dbm':sum(r['rsrp'] for r in rr)/len(rr) if rr else None,'mean_ddr_pct':sum(r['ddr'] for r in rr)/len(rr) if rr else None}
          by=defaultdict(list)
          for r in rows:
              if r['t']>=100 and r['ue'] in affected: by[r['t']].append(r)
          baseline=met(80,99); recovery_tick=None
          for t in range(100,240):
              rr=by[t]; seen={r['ue'] for r in rr}; moved={r['ue'] for r in rr if r['bs']!=0}
              d=sum(r['demand'] for r in rr); real=sum(r['real'] for r in rr); sat=real/d if d else 0
              if len(seen)>=.9*len(affected) and len(moved)>=.9*len(affected) and sat>=.9*baseline['demand_satisfaction']:
                  recovery_tick=t; break
          result={'failure_time':100,'affected_users':len(affected),'baseline':baseline,'transition':met(100,119),'recovery':met(120,159),'steady':met(200,239),'recovery_tick':recovery_tick,'recovery_delay_ticks':None if recovery_tick is None else recovery_tick-100,'final_destinations':dict(Counter(r['bs'] for r in by[239]))}
          print('=== LEGACY CONTROL METRICS ===')
          print(json.dumps(result,indent=2))
          open('metrics-old.json','w').write(json.dumps(result,indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5g-bs-failure-old-algo-control
          path: |
            sim/SHNSim/metrics-old.json
            sim/SHNSim/run.log
            sim/SHNSim/bs_failure_oldalgo_SIM_0.csv
          retention-days: 7
